<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎲 智慧棋類對戰中心</title>
    <style>
        body { background: #1e1e2f; color: #fff; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        h1 { color: #00ffff; text-shadow: 0 0 10px rgba(0, 255, 255, 0.3); margin-bottom: 10px; }
        .controls { margin-bottom: 20px; background: rgba(255, 255, 255, 0.1); padding: 15px 25px; border-radius: 15px; display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        select, button { padding: 10px 15px; font-size: 15px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        select { background: #33334d; color: #fff; border: 1px solid #55557f; }
        button { background: linear-gradient(45deg, #ff00cc, #3333ff); color: white; transition: transform 0.2s; }
        button:hover { transform: scale(1.05); }
        .status { font-size: 1.3rem; margin-bottom: 15px; color: #ffcc00; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .board-container { padding: 10px; background: #8b5a2b; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #board { display: grid; background: #e4a853; border: 2px solid #4a3015; }
        .cell { width: 30px; height: 30px; position: relative; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .cell::before { content: ""; position: absolute; width: 100%; height: 1px; background: #4a3015; top: 50%; left: 0; }
        .cell::after { content: ""; position: absolute; width: 1px; height: 100%; background: #4a3015; left: 50%; top: 0; }
        .stone { width: 26px; height: 26px; border-radius: 50%; position: relative; z-index: 2; box-shadow: 0 3px 6px rgba(0,0,0,0.4); }
        .stone.black { background: radial-gradient(circle at 30% 30%, #555, #000 70%); }
        .stone.white { background: radial-gradient(circle at 30% 30%, #fff, #ccc 70%); border: 1px solid #aaa; }
        .win-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 12, 27, 0.85); backdrop-filter: blur(10px); z-index: 999; justify-content: center; align-items: center; flex-direction: column; }
        .win-modal { background: linear-gradient(135deg, #1f1c2c, #928dab); padding: 40px 60px; border-radius: 20px; text-align: center; border: 2px solid #00ffff; box-shadow: 0 20px 50px rgba(0,0,0,0.7); }
        .win-title { font-size: 2.5rem; color: #ffcc00; margin-bottom: 30px; }
        .modal-btns { display: flex; gap: 20px; justify-content: center; }
        .btn-home { background: linear-gradient(45deg, #4b6cb7, #182848); }
        .rules-card { margin-top: 25px; max-width: 550px; background: rgba(255, 255, 255, 0.05); padding: 15px 20px; border-radius: 10px; color: #ccc; border-left: 4px solid #00ffff; line-height: 1.6; }
    </style>
</head>
<body>

    <h1>🎲 智慧棋類對戰中心</h1>
    
    <div class="controls">
        <label for="game-select">遊戲：</label>
        <select id="game-select">
            <option value="gomoku">五子棋 (15x15)</option>
            <option value="othello">黑白棋 (8x8)</option>
            <option value="go">圍棋體驗 (19x19)</option>
        </select>

        <label for="mode-select">模式：</label>
        <select id="mode-select">
            <option value="pvp">👥 雙人對戰</option>
            <option value="pve-first">🤖 電腦對戰 (玩家先手)</option>
            <option value="pve-second">🤖 電腦對戰 (玩家後手)</option>
        </select>

        <button id="restart-btn">重新開始</button>
    </div>

    <div id="game-status" class="status">輪到：⚫ 黑子</div>

    <div class="board-container">
        <div id="board"></div>
    </div>

    <div class="rules-card">
        <h3 style="margin-top:0; color:#fff;">💡 當前模式指南：</h3>
        <p id="game-desc">載入中...</p>
    </div>

    <div id="win-overlay" class="win-overlay">
        <div class="win-modal">
            <div id="win-message" class="win-title">🎉 黑子獲勝！</div>
            <div class="modal-btns">
                <button id="modal-next-btn">再下一局</button>
                <button id="modal-home-btn" class="btn-home">回首頁選單</button>
            </div>
        </div>
    </div>

            const statusElement = document.getElementById('game-status');
            const descElement = document.getElementById('game-desc');
            const winOverlay = document.getElementById('win-overlay');
            const winMessage = document.getElementById('win-message');
            const modalNextBtn = document.getElementById('modal-next-btn');
