<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎲 智慧棋類對戰中心</title>
    <style>
        body {
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #fff;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            margin-bottom: 10px;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .controls {
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        select, button {
            padding: 10px 15px;
            font-size: 15px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        select {
            background-color: #33334d;
            color: #fff;
            border: 1px solid #55557f;
        }

        button {
            background: linear-gradient(45deg, #ff00cc, #3333ff);
            color: white;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .status {
            font-size: 1.3rem;
            margin-bottom: 15px;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .board-container {
            padding: 10px;
            background: #8b5a2b;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        #board {
            display: grid;
            background: #e4a853;
            gap: 0px;
            border: 2px solid #4a3015;
        }

        .cell {
            width: 35px;
            height: 35px;
            position: relative;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cell::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 1px;
            background-color: #4a3015;
            top: 50%;
            left: 0;
        }
        .cell::after {
            content: "";
            position: absolute;
            width: 1px;
            height: 100%;
            background-color: #4a3015;
            left: 50%;
            top: 0;
        }

        .stone {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            position: relative;
            z-index: 2;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
        }

        .stone.black {
            background: radial-gradient(circle at 30% 30%, #555, #000 70%);
        }

        .stone.white {
            background: radial-gradient(circle at 30% 30%, #fff, #ccc 70%);
            border: 1px solid #aaa;
        }

        /* 獲勝結算畫面 */
        .win-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 12, 27, 0.85);
            backdrop-filter: blur(10px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .win-modal {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            padding: 40px 60px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            border: 2px solid #00ffff;
        }

        .win-title {
            font-size: 2.5rem;
            color: #ffcc00;
            margin-bottom: 30px;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.5);
        }

        .modal-btns {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .modal-btns button {
            font-size: 1.1rem;
            padding: 12px 30px;
        }

        .btn-home {
            background: linear-gradient(45deg, #4b6cb7, #182848);
        }

        .rules-card {
            margin-top: 25px;
            max-width: 550px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #ccc;
            border-left: 4px solid #00ffff;
        }
    </style>
</head>
<body>

    <h1>🎲 智慧棋類對戰中心</h1>
    
    <div class="controls">
        <label for="game-select">遊戲：</label>
        <select id="game-select">
            <option value="gomoku">五子棋 (15x15)</option>
            <option value="othello">黑白棋 (8x8)</option>
            <option value="go">圍棋體驗 (19x19)</option>
        </select>

        <label for="mode-select">模式：</label>
        <select id="mode-select">
            <option value="pvp">👥 雙人對戰</option>
            <option value="pve-first">🤖 電腦對戰 (玩家先手)</option>
            <option value="pve-second">🤖 電腦對戰 (玩家後手)</option>
        </select>

        <button id="restart-btn">重新開始</button>
    </div>

    <div id="game-status" class="status">輪到：⚫ 黑子</div>

    <div class="board-container">
        <div id="board"></div>
    </div>

    <div class="rules-card">
        <h3 style="margin-top:0; color:#fff;">💡 當前模式指南：</h3>
        <p id="game-desc">載入中...</p>
    </div>

    <div id="win-overlay" class="win-overlay">
        <div class="win-modal">
            <div id="win-message" class="win-title">🎉 黑子獲勝！</div>
            <div class="modal-btns">
                <button id="modal-next-btn">再下一局</button>
                <button id="modal-home-btn" class="btn-home">回首頁選單</button>
            </div>
        </div>
    </div>

    <script>
        const boardElement = document.getElementById('board');
        const gameSelect = document.getElementById('game-select');
        const modeSelect = document.getElementById('mode-select');
        const restartBtn = document.getElementById('restart-btn');
        const statusElement = document.getElementById('game-status');
        const descElement = document.getElementById('game-desc');
        
        const winOverlay = document.getElementById('win-overlay');
        const winMessage = document.getElementById('win-message');
        const modalNextBtn = document.getElementById('modal-next-btn');
        const modalHomeBtn = document.getElementById('modal-home-btn');

        let boardSize = 15;
        let currentGame = 'gomoku';
        let gameMode = 'pvp'; 
        let playerColor = 'black'; 
        let currentPlayer = 'black'; 
        let boardState = []; 
        let gameOver = false;
        let isAiThinking = false;

        const descriptions = {
            gomoku: "【五子棋】先連成五子者勝。選擇先手你執黑子先下；選擇後手你執白子，電腦黑子會先落子。",
            othello: "【黑白棋】夾住敵子即可翻轉。選擇先手你執黑，後手執白。最後棋子多者勝。",
            go: "【圍棋體驗】19x19 大棋盤。適合雙人對弈排局，或與電腦進行基礎圍地練習。"
        };

        function initGame() {
            currentGame = gameSelect.value;
            gameMode = modeSelect.value;
            gameOver = false;
            isAiThinking = false;
            currentPlayer = 'black'; 
            winOverlay.style.display = 'none'; 

            if (gameMode === 'pve-second') {
                playerColor = 'white'; 
            } else {
                playerColor = 'black'; 
            }
            
            updateStatusText();
            descElement.innerText = descriptions[currentGame];

            if (currentGame === 'gomoku') boardSize = 15;
            else if (currentGame === 'othello') boardSize = 8;
            else if (currentGame === 'go') boardSize = 19;

            boardState = Array(boardSize).fill(null).map(() => Array(boardSize).fill(null));

            if (currentGame === 'othello') {
                const mid = boardSize / 2;
                boardState[mid-1][mid-1] = 'white';
                boardState[mid][mid] = 'white';
                boardState[mid-1][mid] = 'black';
                boardState[mid][mid-1] = 'black';
            }

            renderBoard();

            if (gameMode === 'pve-second' && currentPlayer === 'black') {
                triggerAiMove();
            }
        }

        function updateStatusText() {
            if (gameOver) return;
            let colorName = currentPlayer === 'black' ? '⚫ 黑子' : '⚪ 白子';
            
            if (gameMode === 'pvp') {
                statusElement.innerText = `輪到：${colorName}`;
            } else {
                statusElement.innerText = currentPlayer === playerColor ? `輪到：${colorName} (你)` : `🤖 電腦思考中...`;
            }
        }

        function renderBoard() {
            boardElement.innerHTML = '';
            boardElement.style.gridTemplateColumns = `repeat(${boardSize}, 35px)`;
            boardElement.style.gridTemplateRows = `repeat(${boardSize}, 35px)`;

            for (let r = 0; r < boardSize; r++) {
                for (let c = 0; c < boardSize; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');

                    if (boardState[r][c]) {
                        const stone = document.createElement('div');
                        stone.classList.add('stone', boardState[r][c]);
                        cell.appendChild(stone);
                    }

                    cell.addEventListener('click', () => handleCellClick(r, c));
                    boardElement.appendChild(cell);
                }
            }
        }

        function handleCellClick(r, c) {
            if (gameOver || isAiThinking || boardState[r][c]) return;
            if (gameMode !== 'pvp' && currentPlayer !== playerColor) return;

        }

        modeSelect.addEventListener('change', initGame);
